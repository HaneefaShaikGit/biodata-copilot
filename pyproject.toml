[project]
name = "biodata-copilot"
version = "0.1.0"
description = "A cloud-based biomedical data platform with grounded AI explanations."
readme = "README.md"
authors = [
    { name = "Haneefa Tasneem Shaik", email = "haneefa.tasneem.shaik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "google-cloud-storage>=3.17.0",
    "openai>=3.36.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
biodata-copilot = "biodata_copilot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
